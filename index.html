<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Console Projets — SDIS de l'Ain</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
:root{
  --bleu:#002395;
  --bleu-clair:#e8ecf7;
  --bleu-survol:#f2f5fc;
  --encre:#1c2330;
  --gris:#6b7484;
  --trait:#dde2ea;
  --fond:#f5f6f8;
  --vert:#9BBB59;
  --jaune:#FFCC00;
  --orange:#F79646;
  --rouge:#C0504D;
  --interrompu:#595959;
  --vert-pastel:#E4EDD2;
  --jaune-pastel:#FFF3CC;
  --orange-pastel:#FDE5D3;
  --rouge-pastel:#F3DCDB;
  --interrompu-pastel:#E4E5E7;
  --neutre-pastel:#EDF0F4;
  --rayon:6px;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  font-family:Tahoma,Verdana,Geneva,sans-serif;
  font-size:13px;color:var(--encre);background:var(--fond);
  display:flex;flex-direction:column;overflow:hidden;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}

/* ---------- Barre supérieure ---------- */
.topbar{
  flex:0 0 auto;display:flex;align-items:center;gap:14px;
  background:var(--bleu);color:#fff;padding:0 14px;height:32px;
}
.topbar .marque{font-weight:bold;letter-spacing:.02em;font-size:12.5px;}
.topbar .spacer{flex:1;}
.btn-top{
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);
  color:#fff;border-radius:var(--rayon);padding:3px 10px;font-size:11.5px;
}
.btn-top:hover{background:rgba(255,255,255,.22);}

/* ---------- Structure ---------- */
.layout{flex:1;display:flex;min-height:0;}
.panneau{
  flex:0 0 290px;width:290px;max-width:32%;
  background:#fff;border-right:1px solid var(--trait);
  display:flex;flex-direction:column;min-height:0;
}
.contenu{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden;}

/* ---------- Liste des projets ---------- */
.recherche{padding:10px;border-bottom:1px solid var(--trait);}
.recherche input,.recherche select{
  width:100%;padding:7px 9px;border:1px solid var(--trait);
  border-radius:var(--rayon);background:#fff;
}
.recherche input:focus,.recherche select:focus,
.champ input:focus,.champ select:focus,.champ textarea:focus{
  outline:2px solid var(--bleu);outline-offset:-1px;border-color:var(--bleu);
}
.filtres{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px;}
.msel{position:relative;min-width:0;}
.msel-large{grid-column:1/-1;}
.msel-btn{width:100%;padding:7px 9px;border:1px solid var(--trait);border-radius:var(--rayon);
  background:#fff;color:var(--encre);text-align:left;font-size:12px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.msel-btn:hover{border-color:var(--bleu);}
.msel-pan{position:absolute;z-index:8;top:calc(100% + 4px);left:0;min-width:100%;max-width:280px;
  background:#fff;border:1px solid var(--trait);border-radius:var(--rayon);
  box-shadow:0 6px 18px rgba(20,28,45,.14);padding:7px;max-height:250px;overflow-y:auto;}
.msel-pan label{display:flex;align-items:center;gap:7px;padding:4px 5px;border-radius:4px;
  cursor:pointer;font-size:12px;white-space:nowrap;}
.msel-pan label:hover{background:var(--bleu-survol);}
.msel-pan .msel-tout{font-weight:bold;border-bottom:1px solid var(--trait);
  margin-bottom:4px;padding-bottom:6px;}
.filtre-date{grid-column:1/-1;display:flex;align-items:center;gap:6px;
  font-size:11px;color:var(--gris);white-space:nowrap;}
.filtre-date input{flex:1;min-width:0;padding:5px 6px;border:1px solid var(--trait);
  border-radius:var(--rayon);background:#fff;font-size:11.5px;}
.liste{flex:1;overflow-y:auto;}
.ligne-projet{
  display:flex;align-items:flex-start;gap:9px;padding:9px 11px;
  border-bottom:1px solid #eef1f5;cursor:pointer;
}
.ligne-projet:hover{background:var(--bleu-survol);}
.ligne-projet.actif{background:var(--bleu-clair);box-shadow:inset 3px 0 0 var(--bleu);}
.ligne-projet>svg{flex:0 0 auto;margin-top:1px;}
.ligne-projet .pastille{flex:0 0 auto;margin-top:3px;}
.ligne-projet .titre{flex:1;min-width:0;}
.ligne-projet .titre b{display:block;font-weight:bold;font-size:12.5px;
  line-height:1.35;white-space:normal;overflow-wrap:anywhere;}
.ligne-projet .titre span{display:block;color:var(--gris);font-size:11px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.compteur{padding:7px 11px;color:var(--gris);font-size:11px;border-bottom:1px solid var(--trait);
  display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:31px;}
.btn-raz{
  background:none;border:none;color:var(--bleu);font-size:11px;font-weight:bold;
  padding:2px 4px;border-radius:4px;text-decoration:underline;
}
.btn-raz:hover{background:var(--bleu-clair);}
.btn-raz[hidden]{display:none;}

/* ---------- Pastilles ---------- */
.pastille{
  display:inline-block;padding:2px 8px;border-radius:11px;
  font-size:11px;font-weight:bold;white-space:nowrap;
}
.p-P1{background:#f7e4e3;color:#C0504D;}
.p-P2{background:#fdeadb;color:#b4611f;}
.p-P3{background:#fdf4d6;color:#8a6d00;}
.p-Termine{background:#eaf2dc;color:#5f7a2a;}
.p-Interrompu{background:#e9eaec;color:#595959;}
.p-neutre{background:#eef1f5;color:#4b5462;}
.p-jalon{background:var(--bleu-clair);color:var(--bleu);}
.p-instance{background:#fdeadb;color:#b4611f;}
.p-nature{background:#eef1f5;color:#4b5462;max-width:150px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;}
.jnl .pastille{flex:0 0 auto;align-self:flex-start;}

/* ---------- En-tête projet ---------- */
.entete{
  background:#fff;border-bottom:1px solid var(--trait);padding:20px 18px 0;
}
.entete h1{margin:0 0 4px;font-size:18px;color:var(--bleu);line-height:1.25;}
.entete .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  color:var(--gris);font-size:11.5px;margin-bottom:12px;}
.entete-haut{display:flex;gap:16px;align-items:flex-start;}
.entete-haut .txt{flex:1;min-width:0;}
.btn.btn-perso{margin-left:auto;flex:0 0 auto;text-decoration:none;display:inline-block;
  white-space:nowrap;max-width:230px;overflow:hidden;text-overflow:ellipsis;
  background:var(--rouge);}
.btn.btn-perso:hover{background:#a34340;}

/* ---------- Onglets ---------- */
.onglets{display:flex;gap:2px;}
.onglet{
  background:none;border:none;border-bottom:3px solid transparent;
  padding:9px 13px;color:var(--gris);font-weight:bold;font-size:12.5px;
}
.onglet:hover{color:var(--encre);}
.onglet.actif{color:var(--bleu);border-bottom-color:var(--bleu);}
.onglet .n{
  display:inline-block;background:#eef1f5;color:#4b5462;border-radius:9px;
  padding:0 6px;margin-left:5px;font-size:10.5px;
}
.onglet.actif .n{background:var(--bleu-clair);color:var(--bleu);}

/* ---------- Corps ---------- */
.corps{flex:1;overflow-y:auto;padding:16px 18px 40px;}
.carte{
  background:#fff;border:1px solid var(--trait);border-radius:var(--rayon);
  padding:14px 16px;margin-bottom:14px;
}
.carte-ouverte{border-color:var(--bleu);box-shadow:0 0 0 1px var(--bleu-clair);}
.carte h2{margin:0 0 12px;font-size:13px;color:var(--bleu);
  text-transform:uppercase;letter-spacing:.06em;}
.grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;}
.champ{display:flex;flex-direction:column;gap:4px;}
.champ label{font-size:11px;color:var(--gris);font-weight:bold;}
.champ input,.champ select,.champ textarea{
  padding:6px 8px;border:1px solid var(--trait);border-radius:4px;background:#fff;width:100%;
}
.champ textarea{resize:vertical;min-height:74px;line-height:1.5;}
.champ .fige{padding:6px 8px;background:#f7f8fa;border:1px solid var(--trait);
  border-radius:4px;color:var(--gris);min-height:30px;}
.pleine{grid-column:1/-1;}
.liste-instance{display:flex;flex-direction:column;gap:0;color:var(--encre);}
.liste-instance span{padding:5px 0;border-bottom:1px solid #eef1f5;}
.liste-instance span:last-child{border-bottom:none;}

/* ---------- Tableaux ---------- */
table{width:100%;border-collapse:collapse;}
th{
  text-align:left;font-size:11px;color:var(--gris);text-transform:uppercase;
  letter-spacing:.05em;padding:6px 8px;border-bottom:2px solid var(--trait);
}
td{padding:5px 8px;border-bottom:1px solid #eef1f5;vertical-align:middle;}
tbody tr:hover{background:var(--bleu-survol);}
td input,td select{
  width:100%;padding:4px 6px;border:1px solid transparent;border-radius:4px;background:transparent;
}
td input:hover,td select:hover{border-color:var(--trait);background:#fff;}
td textarea.auto{width:100%;padding:4px 6px;border:1px solid transparent;border-radius:4px;
  background:transparent;font:inherit;line-height:1.35;resize:none;overflow:hidden;
  min-height:24px;display:block;}
td textarea.auto:hover{border-color:var(--trait);background:#fff;}
td textarea.auto:focus{outline:2px solid var(--bleu);outline-offset:-1px;background:#fff;}
tr.ligne-repli td{vertical-align:middle;}
.ligne-repli{height:auto;}
.col-etroite{width:112px;}
.col-mini{width:74px;}
.col-chevron{width:22px;text-align:center;padding-left:4px;padding-right:0;}
.ligne-repli{cursor:pointer;}
.chevron{color:var(--bleu);font-size:11px;user-select:none;}
.ligne-com td{padding:0 8px 9px;border-bottom:1px solid var(--trait);}
.ligne-com label{display:block;font-size:10.5px;color:var(--gris);font-weight:bold;
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;}
.ligne-com textarea{width:100%;min-height:44px;padding:6px 8px;line-height:1.45;
  border:1px solid var(--trait);border-radius:4px;background:#fff;resize:vertical;}
tbody tr.ligne-com:hover{background:transparent;}
.sous-ligne{display:flex;gap:14px;align-items:flex-start;}
.sl-com{flex:2;min-width:0;}
.sl-pj{flex:1;min-width:190px;}
.pj-bloc{display:flex;flex-direction:column;gap:6px;align-items:flex-start;}
.pj-liste{display:flex;flex-wrap:wrap;gap:6px;}
.pj-chip{background:var(--bleu-clair);color:var(--bleu);border:none;border-radius:4px;
  padding:4px 9px;font-size:11.5px;max-width:230px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;}
.pj-chip:hover{background:#d7e0f5;text-decoration:underline;}
.pj-vide{color:var(--gris);font-size:11.5px;}
.pj-ajout{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;color:var(--bleu);
  font-weight:bold;cursor:pointer;text-transform:none;letter-spacing:normal;}
.pj-ajout input{font-weight:normal;color:var(--gris);max-width:210px;}
.vide{padding:26px;text-align:center;color:var(--gris);}
.vide b{display:block;color:var(--encre);margin-bottom:5px;}

/* ---------- Boutons ---------- */
.btn{
  background:var(--bleu);color:#fff;border:none;border-radius:var(--rayon);
  padding:7px 13px;font-weight:bold;
}
.btn:hover{background:#001a6e;}
.btn-2{background:#fff;color:var(--bleu);border:1px solid var(--bleu);}
.btn-2:hover{background:var(--bleu-clair);}
.btn-sup{background:none;border:none;color:var(--gris);padding:2px 6px;font-size:14px;}
.btn-sup:hover{color:var(--rouge);}
.barre-actions{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap;}
.barre-filtres{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap;}
.barre-filtres input,.barre-filtres select{
  padding:6px 8px;border:1px solid var(--trait);border-radius:var(--rayon);background:#fff;}
.barre-filtres .decompte{color:var(--gris);font-size:11.5px;}
.barre-filtres .msel{min-width:230px;}
.filtre-plage{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--gris);}
.filtre-plage input{padding:6px 8px;border:1px solid var(--trait);border-radius:var(--rayon);background:#fff;}

/* ---------- Planning ---------- */
.planning{overflow-x:auto;}
.pl-grille{position:relative;min-width:680px;}
.pl-controle{margin-bottom:10px;font-size:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.pl-controle label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;}
.pl-controle select{padding:6px 8px;border:1px solid var(--trait);border-radius:var(--rayon);
  background:#fff;max-width:340px;}
.pl-select{position:relative;}
.pl-select-btn{padding:6px 10px;border:1px solid var(--trait);border-radius:var(--rayon);
  background:#fff;color:var(--encre);min-width:210px;text-align:left;}
.pl-select-btn:hover{border-color:var(--bleu);}
.pl-select-panneau{position:absolute;z-index:5;top:calc(100% + 4px);left:0;background:#fff;
  border:1px solid var(--trait);border-radius:var(--rayon);box-shadow:0 6px 18px rgba(20,28,45,.14);
  padding:8px;min-width:330px;max-width:460px;max-height:260px;overflow-y:auto;}
.pl-select-panneau label{display:flex;align-items:flex-start;gap:7px;padding:4px 5px;
  border-radius:4px;cursor:pointer;font-size:12px;line-height:1.35;}
.pl-select-panneau label:hover{background:var(--bleu-survol);}
.pl-select-panneau .pl-tout{font-weight:bold;border-bottom:1px solid var(--trait);
  margin-bottom:4px;padding-bottom:6px;}
.pl-mois{display:flex;border-bottom:1px solid var(--trait);margin-left:230px;}
.pl-mois div{flex:1;text-align:center;font-size:10.5px;color:#3a4150;font-weight:normal;
  padding:4px 0;border-left:1px solid #eef1f5;min-width:0;overflow:hidden;}
.pl-mois div.an-courante{color:var(--bleu);font-weight:bold;}
.pl-mois div.fin-annee{border-right:1px solid var(--trait);}
.pl-fond{position:absolute;left:230px;right:0;top:23px;bottom:0;display:flex;pointer-events:none;}
.pl-fond div{flex:1;border-left:1px solid #f1f4f8;}
.pl-fond div.fin-annee{border-right:1px solid #e4e9f0;}
.pl-auj{position:absolute;top:23px;bottom:0;width:0;border-left:2px solid #E30613;
  pointer-events:none;z-index:2;}
.pl-ligne{display:flex;align-items:center;height:29px;border-bottom:1px solid #f4f6f9;position:relative;}
.pl-nom{flex:0 0 230px;padding-right:12px;font-size:11.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pl-nom.pl-projet{font-weight:bold;color:var(--bleu);}
.pl-nom.pl-action{color:var(--bleu);}
.pl-nom.pl-tache{color:var(--gris);}
.pl-piste{flex:1;position:relative;height:100%;}
.pl-barre{
  position:absolute;top:7px;height:15px;border-radius:3px;
  background:#e9edf3;overflow:hidden;
}
.pl-remplie{height:100%;}
.pl-etiq{position:absolute;top:7px;height:15px;line-height:15px;
  font-size:10px;color:var(--gris);padding-left:5px;}

/* ---------- Journal ---------- */
.jnl{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid #eef1f5;}
.jnl .date{flex:0 0 82px;color:var(--bleu);font-weight:bold;font-size:11.5px;}
.jnl .texte{flex:1;white-space:pre-wrap;line-height:1.5;}
.jnl .auteur{color:var(--gris);font-size:11px;}

/* ---------- Jalons ---------- */
.jalon{display:flex;gap:11px;align-items:baseline;padding:7px 0;border-bottom:1px solid #eef1f5;}
.jalon .date{flex:0 0 82px;color:var(--bleu);font-weight:bold;font-size:11.5px;}

/* ---------- Réglages ---------- */
.voile{
  position:fixed;inset:0;background:rgba(12,18,32,.5);display:none;
  align-items:center;justify-content:center;z-index:50;padding:20px;
}
.voile.ouvert{display:flex;}
.modale{
  background:#fff;border-radius:8px;width:min(880px,100%);max-height:88vh;
  display:flex;flex-direction:column;overflow:hidden;
}
.modale header{background:var(--bleu);color:#fff;padding:12px 16px;font-weight:bold;}
.modale .corps-modale{padding:16px;overflow-y:auto;}
.modale footer{padding:12px 16px;border-top:1px solid var(--trait);
  display:flex;justify-content:flex-end;gap:8px;background:#fafbfc;}
.bloc-reglage{margin-bottom:18px;}
.bloc-reglage h3{margin:0 0 4px;font-size:12.5px;color:var(--bleu);}
.bloc-reglage p{margin:0 0 10px;color:var(--gris);font-size:11.5px;}

/* ---------- Divers ---------- */
.toast{
  position:fixed;bottom:16px;right:16px;background:var(--encre);color:#fff;
  padding:9px 14px;border-radius:var(--rayon);opacity:0;transform:translateY(8px);
  transition:.2s;pointer-events:none;z-index:60;font-size:12px;
}
.toast.vu{opacity:1;transform:none;}
.toast.err{background:var(--rouge);}
.accueil{display:flex;align-items:center;justify-content:center;height:100%;
  color:var(--gris);text-align:center;padding:30px;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>

<div class="topbar">
  <div class="marque">Suivi des projets et actions — SDIS de l'Ain</div>
  <div class="spacer"></div>
  <button class="btn-top" id="btn-actualiser">Actualiser</button>
</div>

<div class="layout">
  <aside class="panneau">
    <div class="recherche">
      <input id="q" type="search" placeholder="Rechercher un projet…" autocomplete="off">
      <div class="filtres">
        <div class="msel" id="m-groupement">
          <button type="button" class="msel-btn"></button>
          <div class="msel-pan" hidden></div>
        </div>
        <div class="msel" id="m-porteur">
          <button type="button" class="msel-btn"></button>
          <div class="msel-pan" hidden></div>
        </div>
        <div class="msel" id="m-priorite">
          <button type="button" class="msel-btn"></button>
          <div class="msel-pan" hidden></div>
        </div>
        <div class="msel" id="m-etat">
          <button type="button" class="msel-btn"></button>
          <div class="msel-pan" hidden></div>
        </div>
        <div class="msel msel-large" id="m-avct">
          <button type="button" class="msel-btn"></button>
          <div class="msel-pan" hidden></div>
        </div>
        <div class="filtre-date">
          <span>Échéance du</span>
          <input id="f-ech-du" type="date" aria-label="Échéance à partir du">
          <span>au</span>
          <input id="f-ech-au" type="date" aria-label="Échéance jusqu'au">
        </div>
      </div>
    </div>
    <div class="compteur">
      <span id="compteur-texte">Chargement…</span>
      <button class="btn-raz" id="btn-raz" hidden>Réinitialiser les filtres</button>
    </div>
    <div class="liste" id="liste"></div>
  </aside>

  <main class="contenu">
    <div id="entete"></div>
    <div class="corps" id="corps">
      <div class="accueil">Sélectionnez un projet dans la liste de gauche.</div>
    </div>
  </main>
</div>

<div class="voile" id="voile">
  <div class="modale">
    <header>Réglages — correspondance des tables et des colonnes</header>
    <div class="corps-modale" id="corps-reglages"></div>
    <footer>
      <button class="btn-2" id="btn-annuler">Annuler</button>
      <button class="btn" id="btn-enregistrer">Enregistrer les réglages</button>
    </footer>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* =======================================================================
   1. Configuration : quelles tables, quelles colonnes
   ======================================================================= */

const DEF = {
  tblMain:"", colProjKey:"ID_Projet_Action_AV", colActKey:"ID_Action_MEO",
  colNature:"Nature", colLibelle:"", colGroupement:"Groupement", colPorteur:"Porteur",
  colPriorite:"Priorité", colAvancement:"Avancement", colStatut:"Statut",
  colCommentaire:"Commentaire", colDebut:"Date_Début", colEch:"Ech_Prev", colFin:"Date_Fin",
  colSuspension:"Date_Suspension", colAbandon:"Date_Abandon",
  colPJ:"Pièce_Jointe",
  colJournalTexte:"Journal_bord",
  tblTache:"", colTacheLien:"", colTacheLibelle:"", colTacheDebut:"", colTacheFin:"",
  colTacheAvancement:"", colTachePorteur:"", colTacheStatut:"", colTacheCommentaire:"",
  tblJournal:"", colJnlLien:"", colJnlDate:"", colJnlTexte:"", colJnlAuteur:"", colJnlNature:"",
  tblJalon:"", colJalLien:"", colJalDate:"", colJalLibelle:"", colJalHisto:"",
  tblInstance:"", colInsLien:"", colInsDate:"", colInsLibelle:"", colInsHisto:"",
  colInsType:"", colInsRapporteur:"",
  btnLibelle:"", btnUrl:"", mdpHash:""
};

const CHAMPS_REGLAGES = [
  {bloc:"Table principale (une ligne = un projet ou une action)", tableKey:"tblMain", champs:[
    ["colLibelle","Libellé du projet / de l'action"],
    ["colNature","Nature (AV, PEPS, MEO)"],

  cfg:Object.assign({},DEF),
  meta:{tables:[],cols:{}},   // cols[tableId] = [{colId,label,type,choices,refTable,refDisplay}]
  data:{main:[],taches:[],journal:[],jalons:[],instances:[]},
  refLabels:{},               // "Table.colId" -> {rowId:libellé}
  projetSel:null,
  onglet:"synthese",
  planningTaches:false,
  planningActions:[],
  plPanneau:false,
  fActions:{porteur:"",avct:"",du:"",au:""},
  fTaches:{porteur:"",avct:"",du:"",au:""},
  ouverts:{},
  deverrouille:false,
  fraction:false,             // avancement stocké en 0–1 ?
  pret:false
};

/* =======================================================================
   2. Utilitaires
   ======================================================================= */

const $ = s => document.querySelector(s);
const esc = v => String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function toast(msg,err){
  const t=$("#toast"); t.textContent=msg; t.className="toast vu"+(err?" err":"");
  clearTimeout(t._h); t._h=setTimeout(()=>t.className="toast",2200);
}

function estListe(v){ return Array.isArray(v) && v[0]==="L"; }
function valListe(v){ return estListe(v) ? v.slice(1) : (v==null||v==="" ? [] : [v]); }

function txt(v){
  if(v==null) return "";
  if(estListe(v)) return v.slice(1).join(", ");
  if(typeof v==="object") return "";
  return String(v);
}

/* --- dates : Grist stocke des secondes epoch (UTC) --- */
function dateVersISO(v){
  if(v==null||v==="") return "";
  if(typeof v!=="number") return "";
  const d=new Date(v*1000);
  return d.toISOString().slice(0,10);
}
function dateVersFR(v){
  const iso=dateVersISO(v);
  if(!iso) return "";
  const [a,m,j]=iso.split("-");
  return j+"/"+m+"/"+a;
}
function isoVersDate(iso){
  if(!iso) return null;
  const [a,m,j]=iso.split("-").map(Number);
  return Date.UTC(a,m-1,j)/1000;
}

/* --- avancement --- */
function pct(v){
  if(v==null||v==="") return null;
  const n=Number(v);
  if(isNaN(n)) return null;
  return S.fraction ? Math.round(n*100) : Math.round(n);
}
function pctVersStock(p){ return S.fraction ? p/100 : p; }

function couleurAvct(p,interrompu){
  if(interrompu) return "var(--interrompu)";
  if(p==null) return "#c9d0da";
  if(p>=100) return "var(--vert)";
  if(p>=50) return "var(--jaune)";
  if(p>=1) return "var(--orange)";
  return "var(--rouge)";
}

function couleurPastel(p,interrompu){
  if(interrompu) return "var(--interrompu-pastel)";
  if(p==null) return "var(--neutre-pastel)";
  if(p>=100) return "var(--vert-pastel)";
  if(p>=50) return "var(--jaune-pastel)";
  if(p>=1) return "var(--orange-pastel)";
  return "var(--rouge-pastel)";
}

function donut(p,taille,interrompu){
  const t=taille||30, r=t/2-3, c=2*Math.PI*r, v=Math.max(0,Math.min(100,p==null?0:p));
  return '<svg width="'+t+'" height="'+t+'" viewBox="0 0 '+t+' '+t+'" aria-hidden="true">'+
    '<circle cx="'+t/2+'" cy="'+t/2+'" r="'+r+'" fill="none" stroke="#e9edf3" stroke-width="5"/>'+
    '<circle cx="'+t/2+'" cy="'+t/2+'" r="'+r+'" fill="none" stroke="'+couleurAvct(p,interrompu)+'" stroke-width="5"'+
    ' stroke-dasharray="'+(c*v/100)+' '+c+'" stroke-linecap="round" transform="rotate(-90 '+t/2+' '+t/2+')"/>'+
    '<text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" font-size="'+(t*0.3)+'"'+
    ' font-family="Tahoma" fill="#1c2330">'+(p==null?"–":v)+'</text></svg>';
}

function pastillePriorite(v){
  const s=txt(v).trim();
  if(!s) return "";
  const cl = /^P1/i.test(s)?"p-P1" : /^P2/i.test(s)?"p-P2" : /^P3/i.test(s)?"p-P3"
    : /termin/i.test(s)?"p-Termine" : /interromp/i.test(s)?"p-Interrompu" : "p-neutre";
  return '<span class="pastille '+cl+'">'+esc(s)+'</span>';
}

/* =======================================================================
   3. Lecture du document
   ======================================================================= */

function colonnesDe(tableId){ return S.meta.cols[tableId]||[]; }
function infoCol(tableId,colId){ return colonnesDe(tableId).find(c=>c.colId===colId)||null; }

async function chargerMeta(){
  const tables = await grist.docApi.fetchTable("_grist_Tables");
  const cols   = await grist.docApi.fetchTable("_grist_Tables_column");

  const refVersTable={}, visibles={};
  tables.id.forEach((ref,i)=>{ refVersTable[ref]=tables.tableId[i]; });
  cols.id.forEach((ref,i)=>{ visibles[ref]={tableId:refVersTable[cols.parentId[i]],colId:cols.colId[i]}; });

  S.meta.tables = tables.tableId.filter(t=>t && !t.startsWith("_grist") && !t.startsWith("GristSummary")).sort();
  S.meta.cols={};
  cols.id.forEach((ref,i)=>{
    const tableId=refVersTable[cols.parentId[i]];
    const colId=cols.colId[i];
    if(!tableId||!colId||colId.startsWith("gristHelper_")||colId==="manualSort") return;
    const type=String(cols.type[i]||"");
    let choices=[];
    try{ const o=JSON.parse(cols.widgetOptions[i]||"{}"); if(Array.isArray(o.choices)) choices=o.choices; }catch(e){}
    const m=type.match(/^(Ref|RefList):(.+)$/);
    const vis = cols.visibleCol ? visibles[cols.visibleCol[i]] : null;
    (S.meta.cols[tableId] = S.meta.cols[tableId]||[]).push({
      colId, label:cols.label[i]||colId, type, choices,
      refTable: m?m[2]:null,
      refDisplay: (m && vis && vis.tableId===m[2]) ? vis.colId : null
    });
  });
}

async function libellesRef(tableId,colId){
  const cle=tableId+"."+colId;
  if(S.refLabels[cle]) return S.refLabels[cle];
  const t=await grist.docApi.fetchTable(tableId);
  const map={};
  t.id.forEach((id,i)=>{ map[id]= t[colId]!==undefined ? txt(t[colId][i]) : String(id); });
  S.refLabels[cle]=map;
  return map;
}

function enLignes(t){
  const lignes=[];
  const cles=Object.keys(t).filter(k=>k!=="id");
  t.id.forEach((id,i)=>{ const o={id}; cles.forEach(k=>o[k]=t[k][i]); lignes.push(o); });
  return lignes;
}

async function charger(){
  const c=S.cfg;
  if(!c.tblMain) return;
  S.data.main = enLignes(await grist.docApi.fetchTable(c.tblMain));

  // avancement : 0–1 ou 0–100 ?
  const vals=S.data.main.map(r=>Number(r[c.colAvancement])).filter(v=>!isNaN(v)&&v!==null);
  S.fraction = vals.length>0 && Math.max.apply(null,vals)<=1;

  S.data.taches   = c.tblTache   ? enLignes(await grist.docApi.fetchTable(c.tblTache))   : [];
  S.data.journal  = c.tblJournal ? enLignes(await grist.docApi.fetchTable(c.tblJournal)) : [];
  S.data.jalons   = c.tblJalon   ? enLignes(await grist.docApi.fetchTable(c.tblJalon))   : [];
  S.data.instances= c.tblInstance? enLignes(await grist.docApi.fetchTable(c.tblInstance)): [];
  await chargerPJ();

  // libellés des colonnes de type Référence utilisées à l'écran
  const aResoudre=[
    [c.tblMain,["colPorteur","colGroupement","colPriorite","colStatut","colNature","colLibelle"]],
    [c.tblTache,["colTachePorteur","colTacheStatut","colTacheLibelle"]],
    [c.tblJournal,["colJnlAuteur","colJnlNature"]],
    [c.tblJalon,["colJalLibelle","colJalHisto"]],
    [c.tblInstance,["colInsLibelle","colInsHisto","colInsType","colInsRapporteur"]]
  ];
  for(const [table,cles] of aResoudre){
    if(!table) continue;
    for(const k of cles){
      const info=infoCol(table,c[k]);
      if(info && info.refTable && info.refDisplay) await libellesRef(info.refTable,info.refDisplay);
    }
  }
}

/* --- accès aux valeurs, en résolvant les références --- */
function lire(tableId,ligne,colId){
  if(!colId||!ligne) return "";
  const v=ligne[colId];
  const info=infoCol(tableId,colId);
  if(info && info.refTable && info.refDisplay){
    const map=S.refLabels[info.refTable+"."+info.refDisplay];
    if(map){
      if(estListe(v)) return v.slice(1).map(id=>map[id]||id).join(", ");
      if(v) return map[v]||String(v);
      return "";
    }
  }
  return txt(v);
}

/* =======================================================================
   4. Regroupement projets / actions / tâches / journal
   ======================================================================= */

function natureDe(r){ return lire(S.cfg.tblMain,r,S.cfg.colNature).toUpperCase().trim(); }
function estProjet(r){ const n=natureDe(r); return n==="AV"||n==="PEPS"; }
function estAction(r){ return natureDe(r)==="MEO"; }
function cleProjet(r){ return txt(r[S.cfg.colProjKey]); }

function interrompu(r){
  return !!(r[S.cfg.colSuspension] || r[S.cfg.colAbandon]);
}

function projets(){
  return S.data.main.filter(estProjet).sort((a,b)=>
    lire(S.cfg.tblMain,a,S.cfg.colLibelle).localeCompare(lire(S.cfg.tblMain,b,S.cfg.colLibelle),"fr"));
}
function actionsDe(p){
  const c=S.cfg;
  const info=infoCol(c.tblMain,c.colProjKey);
  const parRef=!!(info && /^Ref(List)?:/.test(info.type));
  const cle=txt(p[c.colProjKey]);                    // identifiant porté par le projet
  const lib=lire(c.tblMain,p,c.colLibelle);          // libellé du projet
  return S.data.main.filter(r=>{
    if(!estAction(r)) return false;
    const v=r[c.colProjKey];
    const vals=(estListe(v)?v.slice(1):[v]);
    if(parRef) return vals.some(x=>Number(x)===p.id);
    const textes=vals.map(x=>txt(x)).filter(x=>x!=="");
    if(!textes.length) return false;
    if(cle && textes.includes(cle)) return true;
    if(lib && textes.includes(lib)) return true;     // l'action désigne son projet par son libellé
    return false;
  });
}
/* lignes susceptibles de porter des tâches : les actions, et le projet lui-même */
function porteursDeTaches(p){
  const liste=actionsDe(p);
  return tachesDe(p).length ? [p].concat(liste) : liste;
}

function tachesDe(action){
  const c=S.cfg;
  if(!c.tblTache||!c.colTacheLien) return [];
  const cle=txt(action[c.colActKey]);
  return S.data.taches.filter(t=>lieA(c.tblTache,t,c.colTacheLien,action.id,cle));
}
function journalDe(p){
  const c=S.cfg;
  if(!c.tblJournal||!c.colJnlLien) return [];
  const cle=cleProjet(p);
  return S.data.journal.filter(j=>lieA(c.tblJournal,j,c.colJnlLien,p.id,cle)).sort((a,b)=>(Number(b[c.colJnlDate])||0)-(Number(a[c.colJnlDate])||0));
}
function lieA(tableId,ligne,colLien,cibleId,cleTexte){
  const info=infoCol(tableId,colLien);
  const v=ligne[colLien];
  const l=estListe(v)?v.slice(1):[v];
  if(info && /^Ref(List)?:/.test(info.type))      // colonne Référence : on compare les identifiants de ligne
    return l.some(x=>Number(x)===Number(cibleId));
  if(cleTexte===null || cleTexte===undefined || cleTexte==="") return false;
  return l.some(x=>String(x)===String(cleTexte)); // sinon : on compare les clés saisies
}

function dateDepuisTexte(s){
  const m=String(s||"").match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  return m ? Date.UTC(+m[3],+m[2]-1,+m[1])/1000 : null;
}

function jalonsDe(p){
  const c=S.cfg, out=[];
  if(c.tblJalon && c.colJalLien)
    S.data.jalons.filter(j=>lieA(c.tblJalon,j,c.colJalLien,p.id,cleProjet(p))).forEach(j=>{
      const lib=lire(c.tblJalon,j,c.colJalHisto||c.colJalLibelle);
      out.push({
        id:j.id, table:c.tblJalon, genre:"Jalon",
        date:Number(j[c.colJalDate])||dateDepuisTexte(lib),
        libelle:lib
      });
    });
  if(c.tblInstance && c.colInsLien)
    S.data.instances.filter(j=>lieA(c.tblInstance,j,c.colInsLien,p.id,cleProjet(p))).forEach(j=>{
      const lib=lire(c.tblInstance,j,c.colInsHisto||c.colInsLibelle);
      out.push({
        id:j.id, table:c.tblInstance, genre:"Instance",
        date:Number(j[c.colInsDate])||dateDepuisTexte(lib),
        libelle:lib,
        type:c.colInsType?lire(c.tblInstance,j,c.colInsType):"",
        rapporteur:c.colInsRapporteur?lire(c.tblInstance,j,c.colInsRapporteur):""
      });
    });
  return out.sort((a,b)=>{
    const da=Number(a.date)||null, db=Number(b.date)||null;
    if(da===null && db===null) return 0;
    if(da===null) return 1;          // sans date : en fin de liste
    if(db===null) return -1;
    return da-db;                    // du plus ancien au plus récent
  });
}

const DATES_FILTRE=["#f-ech-du","#f-ech-au"];

/* menus à cases à cocher : priorité, état, avancement */
const MENUS={
  "m-groupement":{tous:"Tous groupements", sel:[], opts:[]},
  "m-porteur":{tous:"Tous porteurs", sel:[], opts:[]},
  "m-priorite":{tous:"Toutes priorités", sel:[], opts:[]},
  "m-etat":{tous:"Tous états", sel:[], opts:[
    ["encours","En cours"],["termine","Terminés"],["afaire","À faire"],["interrompu","Interrompus"]]},
  "m-avct":{tous:"Tout avancement", sel:[], opts:[
    ["0","0 %"],["1-49","1 à 49 %"],["50-99","50 à 99 %"],["100","100 %"],["sans","Non renseigné"]]}
};

function rendreMenu(id){
  const m=MENUS[id], wrap=$("#"+id);
  if(!wrap) return;
  const n=m.sel.length;
  const etiq = n===0 ? m.tous
    : n===1 ? (m.opts.find(o=>o[0]===m.sel[0])||[,m.sel[0]])[1]
    : n+" sélectionnés";
  wrap.querySelector(".msel-btn").textContent=etiq+" ▾";
  wrap.querySelector(".msel-pan").innerHTML=
    '<label class="msel-tout"><input type="checkbox" data-tout'+(n===0?" checked":"")+'> '+esc(m.tous)+'</label>'+
    m.opts.map(([v,l])=>'<label><input type="checkbox" value="'+esc(v)+'"'+
      (m.sel.includes(v)?" checked":"")+'> '+esc(l)+'</label>').join("");
  wrap.querySelectorAll(".msel-pan input").forEach(inp=>inp.onchange=()=>{
    if(inp.hasAttribute("data-tout")) m.sel=[];
    else m.sel = inp.checked ? m.sel.concat([inp.value]) : m.sel.filter(x=>x!==inp.value);
    rendreMenu(id);
    (m.maj||rendreListe)();
  });
}

function brancherMenu(id){
  const wrap=$("#"+id);
  if(!wrap) return;
  wrap.querySelector(".msel-btn").onclick=()=>{
    const pan=wrap.querySelector(".msel-pan");
    const ouvrir=pan.hidden;
    document.querySelectorAll(".msel-pan").forEach(x=>x.hidden=true);
    pan.hidden=!ouvrir;
  };
  rendreMenu(id);
}

function brancherMenus(){ Object.keys(MENUS).forEach(brancherMenu); }

function etatDe(p){
  const c=S.cfg;
  if(interrompu(p)) return "interrompu";
  const a=pct(p[c.colAvancement]);
  if(a===100) return "termine";
  if(!a) return "afaire";
  return "encours";
}

function remplirFiltres(){
  const c=S.cfg, ps=projets();
  const uniq=(f)=>[...new Set(ps.map(f).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"fr"));
  const alimente=(id,f)=>{
    MENUS[id].opts=uniq(f).map(v=>[v,v]);
    MENUS[id].sel=MENUS[id].sel.filter(v=>MENUS[id].opts.some(o=>o[0]===v));
  };
  alimente("m-groupement",p=>lire(c.tblMain,p,c.colGroupement));
  alimente("m-porteur",   p=>lire(c.tblMain,p,c.colPorteur));
  alimente("m-priorite",  p=>lire(c.tblMain,p,c.colPriorite));
  Object.keys(MENUS).forEach(rendreMenu);
}

function projetsFiltres(){
  const c=S.cfg;
  const q=$("#q").value.trim().toLowerCase();
  const g=MENUS["m-groupement"].sel, po=MENUS["m-porteur"].sel;
  const pr=MENUS["m-priorite"].sel, et=MENUS["m-etat"].sel, av=MENUS["m-avct"].sel;
  const ecDu=isoVersDate($("#f-ech-du").value), ecAu=isoVersDate($("#f-ech-au").value);
  return projets().filter(p=>{
    if(g.length && !g.includes(lire(c.tblMain,p,c.colGroupement))) return false;
    if(po.length && !po.includes(lire(c.tblMain,p,c.colPorteur))) return false;
    if(pr.length && !pr.includes(lire(c.tblMain,p,c.colPriorite))) return false;
    if(et.length && !et.includes(etatDe(p))) return false;
    const a=pct(p[c.colAvancement]);
    if(av.length && !av.some(code=>dansTranche(a,code))) return false;
    if(ecDu!==null || ecAu!==null){
      const e=Number(p[c.colEch])||null;
      if(!e) return false;
      if(ecDu!==null && e<ecDu) return false;
      if(ecAu!==null && e>ecAu) return false;
    }
    if(q){
      const foin=[c.colLibelle,c.colPorteur,c.colGroupement,c.colCommentaire,c.colProjKey]
        .map(k=>lire(c.tblMain,p,k)).join(" ").toLowerCase();
      if(!foin.includes(q)) return false;
    }
    return true;
  });
}

function filtresActifs(){
  return !!$("#q").value.trim() || DATES_FILTRE.some(s=>$(s).value)
    || Object.keys(MENUS).some(id=>MENUS[id].sel.length);
}

function reinitialiserFiltres(){
  $("#q").value="";
  DATES_FILTRE.forEach(s=>$(s).value="");
  Object.keys(MENUS).forEach(id=>{ MENUS[id].sel=[]; rendreMenu(id); });
  rendreListe();
  $("#q").focus();
}

function rendreListe(){
  const c=S.cfg, liste=projetsFiltres(), el=$("#liste");
  $("#compteur-texte").textContent = liste.length+" projet"+(liste.length>1?"s":"")+" sur "+projets().length;
  $("#btn-raz").hidden = !filtresActifs();
  if(!liste.length){
    el.innerHTML='<div class="vide"><b>Aucun projet</b>Modifiez la recherche ou les filtres.</div>';
    return;
  }
  el.innerHTML = liste.map(p=>{
    const a=pct(p[c.colAvancement]), i=interrompu(p);
    const nbA=actionsDe(p).length;
    return '<div class="ligne-projet'+(S.projetSel&&S.projetSel.id===p.id?" actif":"")+'" data-id="'+p.id+'">'+
      donut(a,30,i)+
      '<div class="titre"><b>'+esc(lire(c.tblMain,p,c.colLibelle)||"(sans libellé)")+'</b>'+
      '<span>'+esc(lire(c.tblMain,p,c.colGroupement))+(nbA?' · '+nbA+' action'+(nbA>1?'s':''):'')+'</span></div>'+
      pastillePriorite(lire(c.tblMain,p,c.colPriorite))+'</div>';
  }).join("");
  el.querySelectorAll(".ligne-projet").forEach(d=>d.onclick=()=>{
    S.projetSel=S.data.main.find(r=>r.id===Number(d.dataset.id));
    rendreListe(); rendreProjet();
  });
}

function urlSure(u){
  const s=String(u||"").trim();
  if(!s) return "";
  if(/^https?:\/\//i.test(s)) return s;
  if(/^[a-z]+:/i.test(s)) return "";        // on écarte javascript:, data:, etc.
  return "https://"+s;
}

function boutonPerso(){
  const c=S.cfg, u=urlSure(c.btnUrl);
  if(!c.btnLibelle || !u) return "";
  return '<a class="btn btn-perso" href="'+esc(u)+'" target="_blank" rel="noopener">'+
    esc(c.btnLibelle)+'</a>';
}

/* --- éditeur de champ générique --- */
function editeur(tableId,ligne,colId,opts){
  opts=opts||{};
  if(!colId) return '<div class="fige">Colonne non paramétrée</div>';
  const info=infoCol(tableId,colId);
  const v=ligne[colId];
  const attr='data-t="'+tableId+'" data-r="'+ligne.id+'" data-c="'+colId+'"';
  if(!info) return '<div class="fige">'+esc(txt(v))+'</div>';
  if(info.type.startsWith("RefList")||info.type.startsWith("ChoiceList")||info.type.startsWith("Attachments"))
    return '<div class="fige">'+esc(lire(tableId,ligne,colId))+'</div>';
  if(info.type.startsWith("Ref:")){
    const map=S.refLabels[info.refTable+"."+info.refDisplay];
    if(!map) return '<div class="fige">'+esc(lire(tableId,ligne,colId))+'</div>';
    const ids=Object.keys(map).sort((x,y)=>String(map[x]).localeCompare(String(map[y]),"fr"));
    return '<select class="edit" data-k="ref" '+attr+'><option value="0"></option>'+
      ids.map(id=>'<option value="'+id+'"'+(String(v)===id?" selected":"")+'>'+esc(map[id])+'</option>').join("")+'</select>';
  }
  if(info.type.startsWith("Date"))
    return '<input class="edit" type="date" data-k="date" '+attr+' value="'+dateVersISO(v)+'">';
  if(info.type==="Choice")
    return '<select class="edit" data-k="txt" '+attr+'><option value=""></option>'+
      info.choices.map(o=>'<option'+(String(v)===o?" selected":"")+'>'+esc(o)+'</option>').join("")+'</select>';
  if(info.type==="Bool")
    return '<select class="edit" data-k="bool" '+attr+'><option value="">–</option>'+
      '<option value="1"'+(v?" selected":"")+'>Oui</option><option value="0"'+(v===false?" selected":"")+'>Non</option></select>';
  if(opts.multi)
    return '<textarea class="edit" data-k="txt" '+attr+'>'+esc(txt(v))+'</textarea>';
  if(opts.auto)
    return '<textarea class="edit auto" rows="1" data-k="txt" '+attr+'>'+esc(txt(v))+'</textarea>';
  if(info.type.startsWith("Numeric")||info.type.startsWith("Int"))
    return '<input class="edit" type="number" step="any" data-k="num" '+attr+' value="'+esc(v==null?"":v)+'">';
  return '<input class="edit" type="text" data-k="txt" '+attr+' value="'+esc(txt(v))+'">';
}

function brancherEditeurs(){
  const ajuster=el=>{ el.style.height="auto"; el.style.height=(el.scrollHeight+2)+"px"; };
  document.querySelectorAll("textarea.auto").forEach(el=>{
    ajuster(el);
    el.oninput=()=>ajuster(el);
  });
  document.querySelectorAll(".edit").forEach(el=>{
    el.onchange=async()=>{
      const {t,r,c,k}=el.dataset;
      let v=el.value;
      if(k==="date") v=isoVersDate(v);
      else if(k==="num") v=v===""?null:Number(v);
      else if(k==="ref") v=Number(v)||0;
      else if(k==="bool") v=v===""?null:v==="1";
      await maj(t,Number(r),c,v);
      await charger(); rendreListe(); rendreProjet();
    };
  });
  document.querySelectorAll(".edit-avct").forEach(el=>{
    el.onchange=async()=>{
      const {t,r,c}=el.dataset;
      const p=Math.max(0,Math.min(100,Number(el.value)||0));
      await maj(t,Number(r),c,pctVersStock(p));
      await charger(); rendreListe(); rendreProjet();
    };
  });
}

/* --- outils de filtre et de saisie --- */
function dansTranche(a,code){
  if(!code) return true;
  if(code==="sans") return a===null;
  if(code==="0") return a===0;
  if(code==="1-49") return a!==null&&a>=1&&a<=49;
  if(code==="50-99") return a!==null&&a>=50&&a<=99;
  if(code==="100") return a===100;
  return true;
}

function barreFiltres(prefixe,etat,porteurs,total,affiches,menuId,libelleDate){
  const actif = etat.porteur||etat.avct||etat.du||etat.au||MENUS[menuId].sel.length;
  return '<div class="barre-filtres">'+
    '<div class="msel" id="'+menuId+'"><button type="button" class="msel-btn"></button>'+
      '<div class="msel-pan" hidden></div></div>'+
    '<select id="'+prefixe+'-porteur"><option value="">Tous porteurs</option>'+
      porteurs.map(v=>'<option'+(etat.porteur===v?" selected":"")+'>'+esc(v)+'</option>').join("")+'</select>'+
    '<select id="'+prefixe+'-avct">'+
      [["","Tout avancement"],["0","0 %"],["1-49","1 à 49 %"],["50-99","50 à 99 %"],
       ["100","100 %"],["sans","Non renseigné"]]
        .map(([v,l])=>'<option value="'+v+'"'+(etat.avct===v?" selected":"")+'>'+l+'</option>').join("")+'</select>'+
    '<span class="filtre-plage">'+libelleDate+' du '+
      '<input id="'+prefixe+'-du" type="date" value="'+esc(etat.du)+'"> au '+
      '<input id="'+prefixe+'-au" type="date" value="'+esc(etat.au)+'"></span>'+
    (actif
      ? '<button class="btn-raz" id="'+prefixe+'-raz">Réinitialiser</button>'+
        '<span class="decompte">'+affiches+' sur '+total+'</span>'
      : '<span class="decompte">'+total+' au total</span>')+
    '</div>';
}

function brancherFiltres(prefixe,etat,rendu,menuId){
  const po=$("#"+prefixe+"-porteur");
  if(po) po.onchange=()=>{ etat.porteur=po.value; rendu(); };
  const av=$("#"+prefixe+"-avct");
  if(av) av.onchange=()=>{ etat.avct=av.value; rendu(); };
  const du=$("#"+prefixe+"-du");
  if(du) du.onchange=()=>{ etat.du=du.value; rendu(); };
  const au=$("#"+prefixe+"-au");
  if(au) au.onchange=()=>{ etat.au=au.value; rendu(); };

  if(raz) raz.onclick=()=>{
    etat.porteur=""; etat.avct=""; etat.du=""; etat.au="";
    MENUS[menuId].sel=[];
    rendu();
  };
  brancherMenu(menuId);
}

/* prépare le menu de sélection des actions d'un onglet */
function menuActions(id,actions,rendu){
  const c=S.cfg;
  if(!MENUS[id]) MENUS[id]={tous:"Toutes les actions", sel:[], opts:[]};
  MENUS[id].opts=actions.map(a=>[String(a.id),lire(c.tblMain,a,c.colLibelle)||"(action sans libellé)"]);
  MENUS[id].sel=MENUS[id].sel.filter(v=>MENUS[id].opts.some(o=>o[0]===v));
  MENUS[id].maj=rendu;
  return MENUS[id].sel;
}

function dansPlage(valeur,du,au){
  const d=isoVersDate(du), a=isoVersDate(au);
  if(d===null && a===null) return true;
  const e=Number(valeur)||null;
  if(!e) return false;
  if(d!==null && e<d) return false;
  if(a!==null && e>a) return false;
  return true;
}

function champVierge(tableId,colId,id){
  const info=infoCol(tableId,colId);
  if(!info) return '<input id="'+id+'" type="text">';
  if(info.type==="Choice")
    return '<select id="'+id+'"><option value=""></option>'+
      info.choices.map(o=>'<option>'+esc(o)+'</option>').join("")+'</select>';
  if(info.type.startsWith("Ref:")){
    const map=S.refLabels[info.refTable+"."+info.refDisplay];
    if(map){
      const ids=Object.keys(map).sort((x,y)=>String(map[x]).localeCompare(String(map[y]),"fr"));
      return '<select id="'+id+'"><option value="0"></option>'+
        ids.map(i=>'<option value="'+i+'">'+esc(map[i])+'</option>').join("")+'</select>';
    }
  }
  if(info.type.startsWith("Date")) return '<input id="'+id+'" type="date">';
  if(info.type.startsWith("Numeric")||info.type.startsWith("Int"))
    return '<input id="'+id+'" type="number" step="any">';

}

function valeurChamp(id,tableId,colId){
  const el=$("#"+id);

  if(info.type.startsWith("Numeric")||info.type.startsWith("Int")) return v===""?null:Number(v);
  return v;

function ligneDe(tableId,rowId){
  const c=S.cfg;
  const source = tableId===c.tblMain ? S.data.main
    : tableId===c.tblTache ? S.data.taches
    : tableId===c.tblJournal ? S.data.journal
    : tableId===c.tblJalon ? S.data.jalons
    : tableId===c.tblInstance ? S.data.instances : [];
  return source.find(r=>r.id===Number(rowId))||null;
}

function blocPJ(tableId,ligne,colId){
  if(!colId) return "";
  const ids=valListe(ligne[colId]).map(Number).filter(Boolean);
  const chips = ids.length

        esc((S.pj[id]&&S.pj[id].nom)||("pièce "+id))+'</button>').join("")

      const sous=document.querySelector('[data-sous="'+CSS.escape(cle)+'"]');
      if(!sous) return;
      const ouvert=!S.ouverts[cle];
      S.ouverts[cle]=ouvert;

function brancherPJ(){
  document.querySelectorAll(".pj-chip").forEach(b=>b.onclick=async()=>{
    try{
      const tk=await grist.docApi.getAccessToken({readOnly:true});
      window.open(tk.baseUrl+"/attachments/"+b.dataset.pj+"/download?auth="+tk.token,"_blank","noopener");
    }catch(e){ toast("Ouverture impossible : "+e.message,true); }
  });

  document.querySelectorAll(".pj-input").forEach(inp=>inp.onchange=async()=>{
    const bloc=inp.closest(".pj-bloc");
    const tableId=bloc.dataset.t, rowId=Number(bloc.dataset.r), colId=bloc.dataset.c;
    if(!inp.files.length) return;
    try{
      toast("Envoi en cours…");
      const tk=await grist.docApi.getAccessToken({readOnly:false});
      const nouveaux=[];
      for(const f of inp.files){
        const fd=new FormData();
        fd.append("upload",f,f.name);
        const rep=await fetch(tk.baseUrl+"/attachments?auth="+tk.token,{
          method:"POST", body:fd, headers:{"X-Requested-With":"XMLHttpRequest"}
        });
        if(!rep.ok) throw new Error(rep.status+" "+rep.statusText);
        const res=await rep.json();
        (Array.isArray(res)?res:[res]).forEach(x=>nouveaux.push(Number(x)));
      }
      const ligne=ligneDe(tableId,rowId);
      const actuels=ligne?valListe(ligne[colId]).map(Number).filter(Boolean):[];
      await grist.docApi.applyUserActions([["UpdateRecord",tableId,rowId,
        {[colId]:["L"].concat(actuels,nouveaux)}]]);
      toast(nouveaux.length>1?"Pièces jointes ajoutées":"Pièce jointe ajoutée");
      await charger(); rendreProjet();
    }catch(e){
      toast("Envoi impossible : "+e.message,true);
      inp.value="";
    }
  });
}

async function empreinte(txtClair){
  const donnees=new TextEncoder().encode("console-projets|"+txtClair);
  if(window.crypto && crypto.subtle){
    const buf=await crypto.subtle.digest("SHA-256",donnees);
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
  }
  let h=0;                                   // secours si l'API n'est pas disponible
  for(const o of donnees) h=(h*31+o)>>>0;
  return "s"+h.toString(16);
}

async function motDePasseValide(invite){
  if(!S.cfg.mdpHash) return true;              // aucun mot de passe défini
  const saisi=prompt(invite);
  if(saisi===null) return false;               // annulation
  if(await empreinte(saisi)===S.cfg.mdpHash) return true;
  toast("Mot de passe incorrect",true);
  return false;
}

async function confirmerSuppression(question){
  if(!confirm(question)) return false;
  return await motDePasseValide("Mot de passe pour confirmer la suppression :");
}

  if(S.deverrouille){ S.deverrouille=false; vueSynthese(p); return; }
  if(await motDePasseValide("Mot de passe pour modifier ces champs :")){

/* --- Actions --- */
function vueActions(p){
  const c=S.cfg, t=c.tblMain, toutes=actionsDe(p), f=S.fActions;
  const porteurs=[...new Set(toutes.map(r=>lire(t,r,c.colPorteur)).filter(Boolean))]
    .sort((a,b)=>a.localeCompare(b,"fr"));
  const sel=menuActions("m-fa-action",toutes,()=>vueActions(p));
  const acts=toutes.filter(r=>{
    if(sel.length && !sel.includes(String(r.id))) return false;
    if(f.porteur && lire(t,r,c.colPorteur)!==f.porteur) return false;
    if(!dansTranche(pct(r[c.colAvancement]),f.avct)) return false;
    if(!dansPlage(r[c.colEch],f.du,f.au)) return false;
    return true;
  });

  let html='<div class="barre-actions"><button class="btn" id="add-action">+ Ajouter une action</button>'+
    '<span style="color:var(--gris)">Les modifications sont enregistrées dans Grist à la sortie du champ.</span></div>'+
    barreFiltres("fa",f,porteurs,toutes.length,acts.length,"m-fa-action","Échéance");
  if(!acts.length){
    html+='<div class="carte"><div class="vide"><b>'+
      (toutes.length?"Aucune action ne correspond":"Aucune action pour ce projet")+'</b>'+
      (toutes.length?"Modifiez la recherche ou les filtres.":"Créez la première action de mise en œuvre.")+
      '</div></div>';
  }else{
    html+='<div class="carte"><table><thead><tr>'+
      '<th class="col-chevron"></th>'+
      '<th>Action</th><th class="col-mini">Avct</th><th class="col-etroite">Porteur</th>'+
      '<th class="col-etroite">Début</th><th class="col-etroite">Échéance</th>'+
      '<th class="col-etroite">Fin</th><th style="width:34px"></th></tr></thead><tbody>'+
      acts.map(r=>{
        const a=pct(r[c.colAvancement]);
        const cle=t+":"+r.id, ouvert=!!S.ouverts[cle];
        const detail=(c.colCommentaire||c.colPJ);
        return '<tr class="ligne-repli" data-repli="'+cle+'"><td class="col-chevron">'+
          (detail?'<span class="chevron">'+(ouvert?"▾":"▸")+'</span>':'')+'</td>'+
          '<td>'+editeur(t,r,c.colLibelle,{auto:true})+'</td>'+
          '<td><input class="edit-avct" type="number" min="0" max="100" step="5" value="'+(a==null?"":a)+
            '" data-t="'+t+'" data-r="'+r.id+'" data-c="'+c.colAvancement+'"></td>'+
          '<td>'+editeur(t,r,c.colPorteur)+'</td>'+
          '<td>'+editeur(t,r,c.colDebut)+'</td>'+
          '<td>'+editeur(t,r,c.colEch)+'</td>'+
          '<td>'+editeur(t,r,c.colFin)+'</td>'+
          '<td><button class="btn-sup" data-sup="'+r.id+'" title="Supprimer l\'action">✕</button></td></tr>'+
          (detail
            ? '<tr class="ligne-com" data-sous="'+cle+'"'+(ouvert?'':' style="display:none"')+
              '><td colspan="8"><div class="sous-ligne">'+
              (c.colCommentaire?'<div class="sl-com"><label>Commentaire</label>'+
                editeur(t,r,c.colCommentaire,{multi:true})+'</div>':'')+
              (c.colPJ?'<div class="sl-pj"><label>Pièces jointes</label>'+
                blocPJ(t,r,c.colPJ)+'</div>':'')+
              '</div></td></tr>'
            : '');
      }).join("")+'</tbody></table></div>';
  }
  $("#corps").innerHTML=html;
  brancherEditeurs();
  brancherPJ();
  brancherRepli();
  brancherFiltres("fa",S.fActions,()=>vueActions(p),"m-fa-action");
  $("#add-action").onclick=async()=>{
    const lib=prompt("Libellé de la nouvelle action :");
    if(!lib) return;
    const champs={[c.colLibelle]:lib};
    const infoN=infoCol(t,c.colNature);
    champs[c.colNature] = (infoN&&infoN.type.startsWith("Ref:")) ? p[c.colNature] : "MEO";
    if(c.colProjKey) champs[c.colProjKey]=p[c.colProjKey];
    await ajouter(t,champs);
    await charger(); rendreListe(); rendreProjet();
  };
  document.querySelectorAll("[data-sup]").forEach(b=>b.onclick=async()=>{
    if(!await confirmerSuppression("Supprimer définitivement cette action du document Grist ?")) return;
    await supprimer(t,Number(b.dataset.sup));
    await charger(); rendreListe(); rendreProjet();
  });
}

/* --- Tâches --- */
function vueTaches(p){
  const c=S.cfg, acts=porteursDeTaches(p);
  if(!c.tblTache){
    $("#corps").innerHTML='<div class="carte"><div class="vide"><b>Table des tâches non paramétrée</b>'+
      'Ouvrez les réglages pour indiquer la table des tâches et sa colonne de liaison.</div></div>';
    return;
  }
  const f=S.fTaches;
  const sel=menuActions("m-ft-action",acts,()=>vueTaches(p));
  const actionsVues=sel.length?acts.filter(a=>sel.includes(String(a.id))):acts;
  const toutesT=acts.reduce((n,a)=>n.concat(tachesDe(a)),[]);
  const porteurs=[...new Set(toutesT.map(r=>lire(c.tblTache,r,c.colTachePorteur)).filter(Boolean))]
    .sort((a,b)=>a.localeCompare(b,"fr"));
  const filtre=r=>{
    if(f.porteur && lire(c.tblTache,r,c.colTachePorteur)!==f.porteur) return false;
    if(!dansTranche(pct(r[c.colTacheAvancement]),f.avct)) return false;
    if(!dansPlage(r[c.colTacheFin],f.du,f.au)) return false;
    return true;
  };
  const actif=!!(f.porteur||f.avct||f.du||f.au||sel.length);
  const retenues=actionsVues.reduce((n,a)=>n+tachesDe(a).filter(filtre).length,0);

  let html=barreFiltres("ft",f,porteurs,toutesT.length,retenues,"m-ft-action","Fin");
  actionsVues.forEach(act=>{
    const ts=tachesDe(act).filter(filtre);
    if(actif && !ts.length) return;
    html+='<div class="carte"><h2>'+esc(lire(c.tblMain,act,c.colLibelle)||"(action sans libellé)")+'</h2>';
    if(!ts.length){
      html+='<div class="vide" style="padding:12px">Aucune tâche rattachée.</div>';
    }else{
      html+='<table><thead><tr><th class="col-chevron"></th>'+
        '<th>Tâche</th><th class="col-mini">Avct</th>'+
        '<th class="col-etroite">Porteur</th><th class="col-etroite">Début</th>'+
        '<th class="col-etroite">Fin</th><th style="width:34px"></th></tr></thead><tbody>'+
        ts.map(r=>{
          const a=pct(r[c.colTacheAvancement]);
          const cle=c.tblTache+":"+r.id, ouvert=!!S.ouverts[cle];
          const detail=!!c.colTacheCommentaire;
          return '<tr class="ligne-repli" data-repli="'+cle+'"><td class="col-chevron">'+
            (detail?'<span class="chevron">'+(ouvert?"▾":"▸")+'</span>':'')+'</td>'+
            '<td>'+editeur(c.tblTache,r,c.colTacheLibelle,{auto:true})+'</td>'+
            '<td>'+(c.colTacheAvancement?'<input class="edit-avct" type="number" min="0" max="100" step="5" value="'+
              (a==null?"":a)+'" data-t="'+c.tblTache+'" data-r="'+r.id+'" data-c="'+c.colTacheAvancement+'">':'')+'</td>'+
            '<td>'+editeur(c.tblTache,r,c.colTachePorteur)+'</td>'+
            '<td>'+editeur(c.tblTache,r,c.colTacheDebut)+'</td>'+
            '<td>'+editeur(c.tblTache,r,c.colTacheFin)+'</td>'+
            '<td><button class="btn-sup" data-supt="'+r.id+'" title="Supprimer la tâche">✕</button></td></tr>'+
            (detail
              ? '<tr class="ligne-com" data-sous="'+cle+'"'+(ouvert?'':' style="display:none"')+
                '><td colspan="7"><label>Commentaire</label>'+
                editeur(c.tblTache,r,c.colTacheCommentaire,{multi:true})+'</td></tr>'
              : '');
        }).join("")+'</tbody></table>';
    }
    html+='<div style="margin-top:10px"><button class="btn-2" data-addt="'+act.id+'">+ Ajouter une tâche</button></div></div>';
  });
  $("#corps").innerHTML = html + (
    !acts.length ? '<div class="carte"><div class="vide"><b>Aucune action</b>'+
      'Créez d\'abord une action dans l\'onglet Actions.</div></div>'
    : (actif && !retenues) ? '<div class="carte"><div class="vide"><b>Aucune tâche ne correspond</b>'+
      'Modifiez la recherche ou les filtres.</div></div>' : "");
  brancherEditeurs();
  brancherRepli();
  brancherFiltres("ft",S.fTaches,()=>vueTaches(p),"m-ft-action");
  document.querySelectorAll("[data-addt]").forEach(b=>b.onclick=async()=>{
    const lib=prompt("Libellé de la nouvelle tâche :");
    if(!lib) return;
    const act=S.data.main.find(r=>r.id===Number(b.dataset.addt));
    const info=infoCol(c.tblTache,c.colTacheLien);
    const champs={[c.colTacheLibelle]:lib};
    if(info && info.type.startsWith("Ref:")) champs[c.colTacheLien]=act.id;
    else if(info && info.type.startsWith("RefList:")) champs[c.colTacheLien]=["L",act.id];
    else champs[c.colTacheLien]=act[c.colActKey];
    await ajouter(c.tblTache,champs);
    await charger(); rendreProjet();
  });
  document.querySelectorAll("[data-supt]").forEach(b=>b.onclick=async()=>{
    if(!await confirmerSuppression("Supprimer définitivement cette tâche du document Grist ?")) return;
    await supprimer(c.tblTache,Number(b.dataset.supt));
    await charger(); rendreProjet();
  });
}

function brancherAjout(p,prefixe,cles,extras,alerte){
  const c=S.cfg;
  const b=$("#"+prefixe+"-ajouter");
  if(!b) return;
  b.onclick=async()=>{
    const lib=valeurChamp(prefixe+"-libelle",c[cles.table],c[cles.lib]);
    if(!lib){ toast(alerte,true); return; }
    const info=infoCol(c[cles.table],c[cles.lien]);
    const champs={[c[cles.lib]]:lib};
    if(c[cles.date]) champs[c[cles.date]]=isoVersDate($("#"+prefixe+"-date").value);
    extras.forEach(e=>{
      if(!c[e.cle] || !$("#"+prefixe+"-"+e.id)) return;
      const v=valeurChamp(prefixe+"-"+e.id,c[cles.table],c[e.cle]);
      if(v!==null && v!=="") champs[c[e.cle]]=v;
    });
    if(info && info.type.startsWith("Ref:")) champs[c[cles.lien]]=p.id;
    else if(info && info.type.startsWith("RefList:")) champs[c[cles.lien]]=["L",p.id];
    else champs[c[cles.lien]]=p[c.colProjKey];
    await ajouter(c[cles.table],champs);
    await charger(); rendreProjet();
  };
}

/* --- Planning --- */
function periodesPlanning(minAn,maxAn){
  const an=new Date().getUTCFullYear();
  const per=[];
  for(let y=minAn;y<=maxAn;y++){
    if(y===an||y===an+1){
      for(let t=0;t<4;t++) per.push({
        debut:Date.UTC(y,t*3,1)/1000, fin:Date.UTC(y,t*3+3,1)/1000,
        label:"T"+(t+1)+" "+y, fin_annee:t===3, courant:y===an
      });
    }else{
      per.push({debut:Date.UTC(y,0,1)/1000, fin:Date.UTC(y+1,0,1)/1000, label:String(y), fin_annee:true});
    }
  }
  return per;
}

function posPlanning(per,ts){
  if(!per.length) return 0;
  if(ts<=per[0].debut) return 0;
  if(ts>=per[per.length-1].fin) return per.length;
  for(let i=0;i<per.length;i++){
    if(ts>=per[i].debut && ts<per[i].fin) return i+(ts-per[i].debut)/(per[i].fin-per[i].debut);
  }
  return per.length;
}

function vuePlanning(p){
  const c=S.cfg;
  const avecTaches=S.planningTaches;
  const actions=actionsDe(p);
  const valides=actions.map(a=>String(a.id));
  S.planningActions=S.planningActions.filter(id=>valides.includes(id));
  const retenues=S.planningActions.length
    ? actions.filter(a=>S.planningActions.includes(String(a.id)))
    : actions;

  const lignes=[{r:p,niv:0}];
  if(avecTaches) tachesDe(p).forEach(t=>lignes.push({r:t,niv:1,tache:true}));
  retenues.forEach(a=>{
    lignes.push({r:a,niv:1});
    if(avecTaches) tachesDe(a).forEach(t=>lignes.push({r:t,niv:2,tache:true}));
  });
  const bornes=(o)=>{
    const d=Number(o.tache?o.r[c.colTacheDebut]:o.r[c.colDebut])||null;
    const f=Number(o.tache?o.r[c.colTacheFin]:(o.r[c.colFin]||o.r[c.colEch]))||null;
    return {d,f};
  };
  const n=S.planningActions.length;
  const etiquette = n===0 ? "Toutes les actions"
    : n===1 ? "1 action sélectionnée" : n+" actions sélectionnées";
  const controle='<div class="pl-controle">'+
    '<div class="pl-select" id="pl-actions-wrap">'+
      '<button type="button" class="pl-select-btn" id="pl-actions-btn">'+etiquette+' ▾</button>'+
      '<div class="pl-select-panneau" id="pl-actions-panneau"'+(S.plPanneau?'':' hidden')+'>'+
        '<label class="pl-tout"><input type="checkbox" id="pl-actions-tout"'+
          (n===0?" checked":"")+'> Toutes les actions</label>'+
        actions.map(a=>'<label><input type="checkbox" class="pl-act" value="'+a.id+'"'+
          (S.planningActions.includes(String(a.id))?" checked":"")+'> '+
          esc(lire(c.tblMain,a,c.colLibelle)||"(action sans libellé)")+'</label>').join("")+
      '</div>'+
    '</div>'+
    '<label><input type="checkbox" id="pl-taches"'+(avecTaches?" checked":"")+'> Afficher les tâches</label>'+
    '</div>';

  const toutes=lignes.map(bornes).filter(b=>b.d||b.f);
  if(!toutes.length){
    $("#corps").innerHTML='<div class="carte"><h2>Planning du projet</h2>'+controle+
      '<div class="vide"><b>Pas de dates à afficher</b>'+
      'Renseignez les dates de début et d\'échéance des actions.</div></div>';
    brancherPlanning(p);
    return;
  }

  const anCourante=new Date().getUTCFullYear();
  const min=Math.min(...toutes.map(b=>b.d||b.f)), max=Math.max(...toutes.map(b=>b.f||b.d));
  const minAn=Math.min(new Date(min*1000).getUTCFullYear(),anCourante);
  const maxAn=Math.max(new Date(max*1000).getUTCFullYear(),anCourante+1);
  const per=periodesPlanning(minAn,maxAn);
  const pos=ts=>posPlanning(per,ts)/per.length*100;

  const entete='<div class="pl-mois">'+per.map(x=>
    '<div class="'+(x.fin_annee?"fin-annee ":"")+(x.courant?"an-courante":"")+'">'+x.label+'</div>').join("")+'</div>';
  const fond='<div class="pl-fond">'+per.map(x=>
    '<div'+(x.fin_annee?' class="fin-annee"':'')+'></div>').join("")+'</div>';

  const auj=Math.floor(Date.now()/1000);
  const marqueur=(auj>=per[0].debut && auj<=per[per.length-1].fin)
    ? '<div class="pl-auj" style="left:'+pos(auj)+'%" title="Aujourd\'hui"></div>' : '';

  const rangs=lignes.map(o=>{
    const b=bornes(o), r=o.r, tache=o.tache;
    const av=pct(tache?r[c.colTacheAvancement]:r[c.colAvancement]);
    const inter=!tache&&interrompu(r);
    const lib=tache?lire(c.tblTache,r,c.colTacheLibelle):lire(c.tblMain,r,c.colLibelle);
    const cls=o.niv===0?"pl-projet":(tache?"pl-tache":"pl-action");
    const nom='<div class="pl-nom '+cls+'" style="padding-left:'+(o.niv*14)+'px" title="'+esc(lib)+'">'+
      esc(lib)+'</div>';
    if(!b.d&&!b.f)
      return '<div class="pl-ligne">'+nom+'<div class="pl-piste"><div class="pl-etiq">dates non renseignées</div></div></div>';
    const deb=b.d||b.f, fin=b.f||b.d;
    const g=pos(deb), w=Math.max(pos(fin)-g,0.4);
    return '<div class="pl-ligne">'+nom+
      '<div class="pl-piste"><div class="pl-barre" style="left:'+g+'%;width:'+w+'%;background:'+
      couleurPastel(av,inter)+'" '+
      'title="'+esc(dateVersFR(deb)+" → "+dateVersFR(fin))+'">'+
      '<div class="pl-remplie" style="width:'+(av==null?0:av)+'%;background:'+couleurAvct(av,inter)+'"></div>'+
      '</div></div></div>';
  }).join("");

  $("#corps").innerHTML='<div class="carte"><h2>Planning du projet</h2>'+controle+
    '<div class="planning"><div class="pl-grille">'+entete+fond+marqueur+rangs+'</div></div>'+
    '<div style="margin-top:12px;display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--gris)">'+
    [["var(--rouge)","À faire"],["var(--orange)","1 à 49 %"],["var(--jaune)","50 à 99 %"],
     ["var(--vert)","Terminé"],["var(--interrompu)","Interrompu"]]
      .map(([c2,l])=>'<span><span style="display:inline-block;width:11px;height:11px;border-radius:2px;'+
        'background:'+c2+';vertical-align:-1px;margin-right:4px"></span>'+l+'</span>').join("")+
    '</div></div>';
  brancherPlanning(p);
}

function brancherPlanning(p){
  const cb=$("#pl-taches");
  if(cb) cb.onchange=()=>{ S.planningTaches=cb.checked; vuePlanning(p); };

  const btn=$("#pl-actions-btn");
  if(btn) btn.onclick=()=>{
    S.plPanneau=!S.plPanneau;
    $("#pl-actions-panneau").hidden=!S.plPanneau;
  };
  const tout=$("#pl-actions-tout");
  if(tout) tout.onchange=()=>{ S.planningActions=[]; S.plPanneau=true; vuePlanning(p); };
  document.querySelectorAll(".pl-act").forEach(el=>el.onchange=()=>{
    const id=el.value;
    S.planningActions = el.checked
      ? S.planningActions.concat([id])
      : S.planningActions.filter(x=>x!==id);
    S.plPanneau=true;
    vuePlanning(p);
  });
}

function rendreReglages(){
  const c=S.cfg;
  $("#corps-reglages").innerHTML = CHAMPS_REGLAGES.map(bloc=>{
    const tid=c[bloc.tableKey];
    return '<div class="bloc-reglage"><h3>'+bloc.bloc+'</h3>'+
      '<div class="champ" style="max-width:340px;margin-bottom:10px"><label>Table</label>'+
      '<select data-cfg="'+bloc.tableKey+'" data-table-de="'+bloc.tableKey+'"><option value=""></option>'+
      S.meta.tables.map(t=>'<option'+(t===tid?" selected":"")+'>'+esc(t)+'</option>').join("")+'</select></div>'+
      '<div class="grille">'+bloc.champs.map(([k,l])=>
        '<div class="champ"><label>'+l+'</label><select data-cfg="'+k+'" data-pour="'+bloc.tableKey+'">'+
        optionsColonnes(tid,c[k])+'</select></div>').join("")+'</div></div>';
  }).join("") +
  '<div class="bloc-reglage"><h3>Verrouillage des champs de la Synthèse</h3>'+
  '<p>Un mot de passe est demandé pour rendre modifiables l\'identité et le calendrier. '+
  'Il n\'est pas stocké en clair, mais ce verrou reste un garde-fou contre la fausse manœuvre, '+
  'pas une sécurité : les données restent modifiables depuis la vue Grist classique.</p>'+
  '<div class="grille">'+
    '<div class="champ"><label>Nouveau mot de passe</label>'+
    '<input type="password" id="mdp-nouveau" autocomplete="new-password" placeholder="'+
      (c.mdpHash?"Mot de passe défini — laisser vide pour le conserver":"Aucun mot de passe défini")+'"></div>'+
    '<div class="champ"><label>&nbsp;</label><label style="font-weight:normal;text-transform:none;'+
      'display:flex;align-items:center;gap:7px;font-size:12px">'+
      '<input type="checkbox" id="mdp-retirer"> Retirer le mot de passe</label></div>'+
  '</div></div>'+
  '<div class="bloc-reglage"><h3>Bouton personnalisé</h3>'+
  '<p>Ce bouton s\'affiche en haut à droite de la fiche projet. Laissez vide pour le masquer.</p>'+
  '<div class="grille">'+
    '<div class="champ"><label>Nom du bouton</label>'+
    '<input type="text" data-cfg="btnLibelle" value="'+esc(c.btnLibelle)+'" placeholder="Ex. : Dossier partagé"></div>'+
    '<div class="champ"><label>Adresse (URL)</label>'+
    '<input type="text" data-cfg="btnUrl" value="'+esc(c.btnUrl)+'" placeholder="https://…"></div>'+
  '</div></div>';

  $("#corps-reglages").querySelectorAll("[data-table-de]").forEach(sel=>{
    sel.onchange=()=>{
      const cle=sel.dataset.tableDe;
      S.cfg[cle]=sel.value;
      $("#corps-reglages").querySelectorAll('[data-pour="'+cle+'"]').forEach(s=>{
        s.innerHTML=optionsColonnes(sel.value,S.cfg[s.dataset.cfg]);
      });
    };
  });
}

async function enregistrerReglages(){
  $("#corps-reglages").querySelectorAll("[data-cfg]").forEach(el=>{ S.cfg[el.dataset.cfg]=el.value; });
  const nouveau=$("#mdp-nouveau")?$("#mdp-nouveau").value:"";
  if($("#mdp-retirer") && $("#mdp-retirer").checked){ S.cfg.mdpHash=""; S.deverrouille=false; }
  else if(nouveau){ S.cfg.mdpHash=await empreinte(nouveau); S.deverrouille=false; }
  try{ await grist.widgetApi.setOptions({cfg:S.cfg}); }catch(e){}
  $("#voile").classList.remove("ouvert");
  await tout();
  toast("Réglages enregistrés");
}

/* =======================================================================
   9. Démarrage
   ======================================================================= */

function devineDefauts(){
  const c=S.cfg;
  if(!c.tblMain){
    const cand=S.meta.tables.find(t=>colonnesDe(t).some(x=>x.colId===DEF.colProjKey));
    if(cand) c.tblMain=cand;
  }
  if(c.tblMain){
    const ids=colonnesDe(c.tblMain).map(x=>x.colId);
    Object.keys(DEF).forEach(k=>{
      if(k.startsWith("col") && !c[k] && ids.includes(DEF[k])) c[k]=DEF[k];
    });
    if(!c.colLibelle){
      const pref=["Libelle","Libellé","Libelle_Action","Titre","Projet_Action","Nom","Intitule"];
      c.colLibelle = pref.find(p=>ids.includes(p)) || ids.find(i=>/libell|titre|nom|action/i.test(i)) || "";
    }
  }
  if(!c.tblTache){
    const t=S.meta.tables.find(x=>/tache|tâche/i.test(x));
    if(t) c.tblTache=t;
  }
  if(c.tblTache){
    const ids=colonnesDe(c.tblTache).map(x=>x.colId);
    if(!c.colTacheLibelle) c.colTacheLibelle=ids.find(i=>/libell|titre|nom|tache/i.test(i))||"";
    if(!c.colTacheLien)    c.colTacheLien   =ids.find(i=>/action|parent|lien/i.test(i))||"";
    if(!c.colTacheDebut)   c.colTacheDebut  =ids.find(i=>/debut|début/i.test(i))||"";
    if(!c.colTacheFin)     c.colTacheFin    =ids.find(i=>/fin|ech/i.test(i))||"";
    if(!c.colTacheAvancement) c.colTacheAvancement=ids.find(i=>/avanc/i.test(i))||"";
    if(!c.colTachePorteur) c.colTachePorteur=ids.find(i=>/porteur|responsable/i.test(i))||"";
    if(!c.colTacheCommentaire) c.colTacheCommentaire=ids.find(i=>/comment/i.test(i))||"";
  }
}

async function tout(){
  try{
    await charger();
    remplirFiltres();
    if(S.projetSel) S.projetSel=S.data.main.find(r=>r.id===S.projetSel.id)||null;
    rendreListe(); rendreProjet();
  }catch(e){
    $("#compteur-texte").textContent="Erreur de lecture";
    $("#corps").innerHTML='<div class="carte"><div class="vide"><b>Lecture impossible</b>'+
      esc(e.message)+'<br>Vérifiez les réglages et le niveau d\'accès du widget.</div></div>';
  }
}

let minuteur=null;
function rechargerBientot(){ clearTimeout(minuteur); minuteur=setTimeout(tout,600); }

async function demarrer(){
  grist.ready({
    requiredAccess:"full",
    onEditOptions:()=>{ rendreReglages(); $("#voile").classList.add("ouvert"); }
  });
  try{
    const o=await grist.widgetApi.getOptions();
    if(o && o.cfg) S.cfg=Object.assign({},DEF,o.cfg);
  }catch(e){}
  await chargerMeta();
  devineDefauts();
  await tout();
  if(!S.cfg.tblMain){ rendreReglages(); $("#voile").classList.add("ouvert"); }
  try{ grist.onRecords(()=>{ if(S.pret) rechargerBientot(); }); }catch(e){}
  S.pret=true;
}

$("#q").oninput=rendreListe;
DATES_FILTRE.forEach(s=>$(s).onchange=rendreListe);
brancherMenus();
$("#btn-raz").onclick=reinitialiserFiltres;
$("#btn-actualiser").onclick=tout;
$("#btn-annuler").onclick=()=>$("#voile").classList.remove("ouvert");
$("#btn-enregistrer").onclick=enregistrerReglages;
$("#voile").onclick=e=>{ if(e.target===$("#voile")) $("#voile").classList.remove("ouvert"); };

document.addEventListener("click",e=>{
  if(!e.target.closest(".msel"))
    document.querySelectorAll(".msel-pan").forEach(x=>x.hidden=true);
  const w=$("#pl-actions-wrap");
  if(S.plPanneau && w && !w.contains(e.target)){
    S.plPanneau=false;
    const pan=$("#pl-actions-panneau");
    if(pan) pan.hidden=true;
  }
});

demarrer();
</script>

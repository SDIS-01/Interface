<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><style>
:root{
  --bleu:#002395;
  --bleu-clair:#e8ecf7;
  --bleu-survol:#f2f5fc;
  --encre:#1c2330;
  --gris:#6b7484;
  --trait:#dde2ea;
  --fond:#f5f6f8;
  --vert:#9BBB59;
  --jaune:#FFCC00;
  --orange:#F79646;
  --rouge:#C0504D;
  --interrompu:#595959;
  --vert-pastel:#E4EDD2;
  --jaune-pastel:#FFF3CC;
  --orange-pastel:#FDE5D3;
  --rouge-pastel:#F3DCDB;
  --interrompu-pastel:#E4E5E7;
  --neutre-pastel:#EDF0F4;
  --rayon:6px;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  font-family:Tahoma,Verdana,Geneva,sans-serif;
  font-size:13px;color:var(--encre);background:var(--fond);
  display:flex;flex-direction:column;overflow:hidden;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}

/* ---------- Barre supérieure ---------- */
.topbar{
  flex:0 0 auto;display:flex;align-items:center;gap:14px;
  background:var(--bleu);color:#fff;padding:0 14px;height:32px;
}
.topbar .marque{font-weight:bold;letter-spacing:.02em;font-size:12.5px;}
.topbar .spacer{flex:1;}
.btn-top{
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);
  color:#fff;border-radius:var(--rayon);padding:3px 10px;font-size:11.5px;
}
.btn-top:hover{background:rgba(255,255,255,.22);}

/* ---------- Structure ---------- */
.layout{flex:1;display:flex;min-height:0;}
.panneau{
  flex:0 0 290px;width:290px;max-width:32%;
  background:#fff;border-right:1px solid var(--trait);
  display:flex;flex-direction:column;min-height:0;
}
.contenu{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden;}

/* ---------- Liste des projets ---------- */
.recherche{padding:10px;border-bottom:1px solid var(--trait);}
.recherche input,.recherche select{
  width:100%;padding:7px 9px;border:1px solid var(--trait);
  border-radius:var(--rayon);background:#fff;
}
.recherche input:focus,.recherche select:focus,
.champ input:focus,.champ select:focus,.champ textarea:focus{
  outline:2px solid var(--bleu);outline-offset:-1px;border-color:var(--bleu);
}
.filtres{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px;}
.msel{position:relative;min-width:0;}
.msel-large{grid-column:1/-1;}
.msel-btn{width:100%;padding:7px 9px;border:1px solid var(--trait);border-radius:var(--rayon);
  background:#fff;color:var(--encre);text-align:left;font-size:12px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.msel-btn:hover{border-color:var(--bleu);}
.msel-pan{position:absolute;z-index:8;top:calc(100% + 4px);left:0;min-width:210px;width:max-content;
  max-width:min(280px,calc(100vw - 40px));
  background:#fff;border:1px solid var(--trait);border-radius:var(--rayon);
  box-shadow:0 6px 18px rgba(20,28,45,.14);padding:7px;max-height:250px;overflow-y:auto;}
.msel-pan label{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:4px;
  cursor:pointer;font-size:12px;}
.msel-pan input[type=checkbox]{flex:0 0 auto;width:14px;height:14px;margin:0;}
.msel-txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.msel-pan label:hover{background:var(--bleu-survol);}
.msel-pan .msel-tout{font-weight:bold;border-bottom:1px solid var(--trait);
  margin-bottom:4px;padding-bottom:6px;}
.filtre-date{grid-column:1/-1;display:flex;align-items:center;gap:6px;
  font-size:11px;color:var(--gris);white-space:nowrap;}
.filtre-date input{flex:1;min-width:0;padding:5px 6px;border:1px solid var(--trait);
  border-radius:var(--rayon);background:#fff;font-size:11.5px;}
.liste{flex:1;overflow-y:auto;}
.ligne-projet{
  display:flex;align-items:flex-start;gap:9px;padding:9px 11px;
  border-bottom:1px solid #eef1f5;cursor:pointer;
}
.ligne-projet:hover{background:var(--bleu-survol);}
.ligne-projet.actif{background:var(--bleu-clair);box-shadow:inset 3px 0 0 var(--bleu);}
.ligne-projet>svg{flex:0 0 auto;margin-top:1px;}
.ligne-projet .pastille{flex:0 0 auto;margin-top:3px;}
.ligne-projet .titre{flex:1;min-width:0;}
.ligne-projet .titre b{display:block;font-weight:bold;font-size:12.5px;
  line-height:1.35;white-space:normal;overflow-wrap:anywhere;}
.ligne-projet .titre span{display:block;color:var(--gris);font-size:11px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.compteur{padding:7px 11px;color:var(--gris);font-size:11px;border-bottom:1px solid var(--trait);
  display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:31px;}
.btn-raz{
  background:none;border:none;color:var(--bleu);font-size:11px;font-weight:bold;
  padding:2px 4px;border-radius:4px;text-decoration:underline;
}
.btn-raz:hover{background:var(--bleu-clair);}
.btn-raz[hidden]{display:none;}

/* ---------- Pastilles ---------- */
.pastille{
  display:inline-block;padding:2px 8px;border-radius:11px;
  font-size:11px;font-weight:bold;white-space:nowrap;
}
.p-P1{background:#f7e4e3;color:#C0504D;}
.p-P2{background:#fdeadb;color:#b4611f;}
.p-P3{background:#fdf4d6;color:#8a6d00;}
.p-Termine{background:#eaf2dc;color:#5f7a2a;}
.p-Interrompu{background:#e9eaec;color:#595959;}
.p-neutre{background:#eef1f5;color:#4b5462;}
.p-jalon{background:var(--bleu-clair);color:var(--bleu);}
.p-instance{background:#fdeadb;color:#b4611f;}
.p-nature{background:#eef1f5;color:#4b5462;max-width:150px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;}
.p-action{background:var(--bleu-clair);color:var(--bleu);max-width:190px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;}
.jnl .pastille{flex:0 0 auto;align-self:flex-start;}

/* ---------- En-tête projet ---------- */
.entete{
  background:#fff;border-bottom:1px solid var(--trait);padding:18px 18px 0;
}
.entete h1{margin:0 0 4px;font-size:18px;color:var(--bleu);line-height:1.25;}
.entete .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  color:var(--gris);font-size:11.5px;margin-bottom:12px;}
.entete-haut{display:flex;gap:16px;align-items:flex-start;}
.entete-haut .txt{flex:1;min-width:0;}
.btn.btn-perso{margin-left:auto;flex:0 0 auto;text-decoration:none;display:inline-block;
  white-space:nowrap;max-width:230px;overflow:hidden;text-overflow:ellipsis;
  background:var(--rouge);}
.btn.btn-perso:hover{background:#a34340;}

/* ---------- Onglets ---------- */
.onglets{display:flex;gap:2px;}
.onglet{
  background:none;border:none;border-bottom:3px solid transparent;
  padding:9px 13px;color:var(--gris);font-weight:bold;font-size:12.5px;
}
.onglet:hover{color:var(--encre);}
.onglet.actif{color:var(--bleu);border-bottom-color:var(--bleu);}
.onglet .n{
  display:inline-block;background:#eef1f5;color:#4b5462;border-radius:9px;
  padding:0 6px;margin-left:5px;font-size:10.5px;
}
.onglet.actif .n{background:var(--bleu-clair);color:var(--bleu);}

/* ---------- Corps ---------- */
.corps{flex:1;overflow-y:auto;padding:16px 18px 40px;}
.carte{
  background:#fff;border:1px solid var(--trait);border-radius:var(--rayon);
  padding:14px 16px;margin-bottom:14px;
}
.carte-ouverte{border-color:var(--bleu);box-shadow:0 0 0 1px var(--bleu-clair);}
.carte h2{margin:0 0 12px;font-size:13px;color:var(--bleu);
  text-transform:uppercase;letter-spacing:.06em;}
.grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;}
.champ{display:flex;flex-direction:column;gap:4px;}
.champ label{font-size:11px;color:var(--gris);font-weight:bold;}
.champ input,.champ select,.champ textarea{
  padding:6px 8px;border:1px solid var(--trait);border-radius:4px;background:#fff;width:100%;
}
.champ textarea{resize:vertical;min-height:74px;line-height:1.5;}
textarea.auto-h{overflow-y:hidden;}
td input.edit-avct{text-align:right;border-radius:4px;}
td input.edit-avct:hover{border-color:var(--bleu);}

/* champ avancement : la valeur et son symbole partagent le même fond coloré */
.avct{display:flex;align-items:center;gap:1px;border-radius:4px;
  border:1px solid transparent;padding-right:6px;overflow:hidden;}
.avct input.edit-avct{flex:1 1 auto;min-width:0;width:auto;text-align:right;font-weight:bold;
  background:transparent;border:none;padding:4px 1px 4px 6px;}
.avct input.edit-avct:hover{background:transparent;border:none;}
.avct input.edit-avct:focus{outline:none;}
.avct .unite{flex:0 0 auto;font-weight:bold;font-size:11.5px;line-height:1;}
.avct input.edit-avct::-webkit-outer-spin-button,
.avct input.edit-avct::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.avct input.edit-avct{-moz-appearance:textfield;}
td .avct:hover{border-color:var(--bleu);}
.champ .avct{border-color:var(--trait);}
.champ .avct input.edit-avct{padding:6px 2px 6px 8px;}
.champ .avct:focus-within,td .avct:focus-within{border-color:var(--bleu);}
.col-mini-avct{width:86px;}
.champ .fige{padding:6px 8px;background:#f7f8fa;border:1px solid var(--trait);
  border-radius:4px;color:var(--gris);min-height:30px;line-height:1.45;
  white-space:pre-wrap;overflow-wrap:anywhere;}
.pleine{grid-column:1/-1;}
.liste-instance{display:flex;flex-direction:column;gap:0;color:var(--encre);}
.liste-instance span{padding:5px 0;border-bottom:1px solid #eef1f5;}
.liste-instance span:last-child{border-bottom:none;}

/* ---------- Tableaux ---------- */
table{width:100%;border-collapse:collapse;}
th{
  text-align:left;font-size:11px;color:var(--gris);text-transform:uppercase;
  letter-spacing:.05em;padding:6px 8px;border-bottom:2px solid var(--trait);
}
td{padding:5px 8px;border-bottom:1px solid #eef1f5;vertical-align:middle;}
tbody tr:hover{background:var(--bleu-survol);}
td input,td select{
  width:100%;padding:4px 6px;border:1px solid transparent;border-radius:4px;background:transparent;
}
td input:hover,td select:hover{border-color:var(--trait);background:#fff;}
td textarea.auto{width:100%;padding:4px 6px;border:1px solid transparent;border-radius:4px;
  background:transparent;font:inherit;line-height:1.35;resize:none;overflow:hidden;
  min-height:24px;display:block;}
td textarea.auto:hover{border-color:var(--trait);background:#fff;}
td textarea.auto:focus{outline:2px solid var(--bleu);outline-offset:-1px;background:#fff;}
tr.ligne-repli td{vertical-align:middle;}
.ligne-repli{height:auto;}
.col-etroite{width:112px;}
.col-mini{width:74px;}
.col-chevron{width:22px;text-align:center;padding-left:4px;padding-right:0;}
.ligne-repli{cursor:pointer;}
.chevron{color:var(--bleu);font-size:11px;user-select:none;}
.ligne-com td{padding:0 8px 9px;border-bottom:1px solid var(--trait);}
.ligne-com label{display:block;font-size:10.5px;color:var(--gris);font-weight:bold;
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;}
.ligne-com textarea{width:100%;min-height:44px;padding:6px 8px;line-height:1.45;
  border:1px solid var(--trait);border-radius:4px;background:#fff;resize:vertical;}
tbody tr.ligne-com:hover{background:transparent;}
.sous-ligne{display:flex;gap:14px;align-items:flex-start;}
.sl-com{flex:2;min-width:0;}
.sl-pj{flex:1;min-width:190px;}
.pj-bloc{display:flex;flex-direction:column;gap:6px;align-items:flex-start;}
.pj-liste{display:flex;flex-wrap:wrap;gap:6px;}
.pj-chip{background:var(--bleu-clair);color:var(--bleu);border:none;border-radius:4px;
  padding:4px 9px;font-size:11.5px;max-width:230px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;}
.pj-chip:hover{background:#d7e0f5;text-decoration:underline;}
.pj-vide{color:var(--gris);font-size:11.5px;}
.pj-ajout{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;color:var(--bleu);
  font-weight:bold;cursor:pointer;text-transform:none;letter-spacing:normal;}
.pj-ajout input{font-weight:normal;color:var(--gris);max-width:210px;}
.vide{padding:26px;text-align:center;color:var(--gris);}
.vide b{display:block;color:var(--encre);margin-bottom:5px;}

/* ---------- Boutons ---------- */
.btn{
  background:var(--bleu);color:#fff;border:none;border-radius:var(--rayon);
  padding:7px 13px;font-weight:bold;
}
.btn:hover{background:#001a6e;}
.btn-2{background:#fff;color:var(--bleu);border:1px solid var(--bleu);}
.btn-2:hover{background:var(--bleu-clair);}
.btn-sup{background:none;border:none;color:var(--gris);padding:2px 6px;font-size:14px;}
.btn-sup:hover{color:var(--rouge);}
.barre-actions{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap;}
.barre-filtres{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap;}
.barre-filtres input,.barre-filtres select{
  padding:6px 8px;border:1px solid var(--trait);border-radius:var(--rayon);background:#fff;}
.barre-filtres .decompte{color:var(--gris);font-size:11.5px;}
.barre-filtres .msel{min-width:230px;}
.filtre-plage{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--gris);}
.filtre-plage input{padding:6px 8px;border:1px solid var(--trait);border-radius:var(--rayon);background:#fff;}

/* ---------- Planning ---------- */
.planning{overflow-x:auto;}
.pl-grille{position:relative;min-width:680px;}
.pl-controle{margin-bottom:10px;font-size:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.pl-controle label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;}
.pl-controle select{padding:6px 8px;border:1px solid var(--trait);border-radius:var(--rayon);
  background:#fff;max-width:340px;}
.pl-select{position:relative;}
.pl-select-btn{padding:6px 10px;border:1px solid var(--trait);border-radius:var(--rayon);
  background:#fff;color:var(--encre);min-width:210px;text-align:left;}
.pl-select-btn:hover{border-color:var(--bleu);}
.pl-select-panneau{position:absolute;z-index:5;top:calc(100% + 4px);left:0;background:#fff;
  border:1px solid var(--trait);border-radius:var(--rayon);box-shadow:0 6px 18px rgba(20,28,45,.14);
  padding:8px;min-width:330px;max-width:460px;max-height:260px;overflow-y:auto;}
.pl-select-panneau label{display:flex;align-items:center;gap:8px;padding:5px 6px;
  border-radius:4px;cursor:pointer;font-size:12px;line-height:1.35;}
.pl-select-panneau input[type=checkbox]{flex:0 0 auto;width:14px;height:14px;margin:0;}
.pl-select-panneau label:hover{background:var(--bleu-survol);}
.pl-select-panneau .pl-tout{font-weight:bold;border-bottom:1px solid var(--trait);
  margin-bottom:4px;padding-bottom:6px;}
.pl-mois{display:flex;border-bottom:1px solid var(--trait);margin-left:230px;}
.pl-mois div{flex:1;text-align:center;font-size:10.5px;color:#3a4150;font-weight:normal;
  padding:4px 0;border-left:1px solid #eef1f5;min-width:0;overflow:hidden;}
.pl-mois div.an-courante{color:var(--bleu);font-weight:bold;}
.pl-mois div.fin-annee{border-right:1px solid var(--trait);}
.pl-fond{position:absolute;left:230px;right:0;top:23px;bottom:0;display:flex;pointer-events:none;}
.pl-fond div{flex:1;border-left:1px solid #f1f4f8;}
.pl-fond div.fin-annee{border-right:1px solid #e4e9f0;}
.pl-auj{position:absolute;top:23px;bottom:0;width:0;border-left:2px solid #E30613;
  pointer-events:none;z-index:2;}
.pl-ligne{display:flex;align-items:center;height:29px;border-bottom:1px solid #f4f6f9;position:relative;}
.pl-nom{flex:0 0 230px;padding-right:12px;font-size:11.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pl-nom.pl-projet{font-weight:bold;color:var(--bleu);}
.pl-nom.pl-action{color:var(--bleu);}
.pl-nom.pl-tache{color:var(--gris);}
.pl-piste{flex:1;position:relative;height:100%;}
.pl-barre{
  position:absolute;top:7px;height:15px;border-radius:3px;
  background:#e9edf3;overflow:hidden;
}
.pl-remplie{height:100%;}
.pl-etiq{position:absolute;top:7px;height:15px;line-height:15px;
  font-size:10px;color:var(--gris);padding-left:5px;}

/* ---------- Journal ---------- */
.jnl{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid #eef1f5;}
.jnl .date{flex:0 0 82px;color:var(--bleu);font-weight:bold;font-size:11.5px;}
.jnl .texte{flex:1;white-space:pre-wrap;line-height:1.5;}
.jnl .auteur{color:var(--gris);font-size:11px;}

/* ---------- Jalons ---------- */
.jalon{display:flex;gap:11px;align-items:baseline;padding:7px 0;border-bottom:1px solid #eef1f5;}
.jalon .date{flex:0 0 82px;color:var(--bleu);font-weight:bold;font-size:11.5px;}

/* ---------- Réglages ---------- */
.voile{
  position:fixed;inset:0;background:rgba(12,18,32,.5);display:none;
  align-items:center;justify-content:center;z-index:50;padding:20px;
}
.voile.ouvert{display:flex;}
.modale{
  background:#fff;border-radius:8px;width:min(880px,100%);max-height:88vh;
  display:flex;flex-direction:column;overflow:hidden;
}
.modale header{background:var(--bleu);color:#fff;padding:12px 16px;font-weight:bold;}
.modale .corps-modale{padding:16px;overflow-y:auto;}
.modale footer{padding:12px 16px;border-top:1px solid var(--trait);
  display:flex;justify-content:flex-end;gap:8px;background:#fafbfc;}
.bloc-reglage{margin-bottom:18px;}
.bloc-reglage h3{margin:0 0 4px;font-size:12.5px;color:var(--bleu);}
.bloc-reglage p{margin:0 0 10px;color:var(--gris);font-size:11.5px;}

/* ---------- Divers ---------- */
.toast{
  position:fixed;bottom:16px;right:16px;background:var(--encre);color:#fff;
  padding:9px 14px;border-radius:var(--rayon);opacity:0;transform:translateY(8px);
  transition:.2s;pointer-events:none;z-index:60;font-size:12px;
}
.toast.vu{opacity:1;transform:none;}
.toast.err{background:var(--rouge);}
.accueil{display:flex;align-items:center;justify-content:center;height:100%;
  color:var(--gris);text-align:center;padding:30px;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style></head><body style="padding:20px;background:#fff;display:block">
